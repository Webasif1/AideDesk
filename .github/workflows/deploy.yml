# CI/CD: every push to main is tested, built into a Docker image, pushed to
# Amazon ECR and rolled out to the ECS Fargate service (see DEPLOY.md).
# Pull requests only run the tests.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time; a newer push waits instead of racing a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# AWS resource names. The defaults match DEPLOY.md. If yours differ, add a
# repository variable with the same name (Settings → Secrets and variables →
# Actions → Variables) rather than editing this file.
env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'aidedesk' }}
  ECS_CLUSTER: ${{ vars.ECS_CLUSTER || 'aidedesk-cluster' }}
  ECS_SERVICE: ${{ vars.ECS_SERVICE || 'aidedesk-service' }}
  ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION || 'aidedesk' }}
  CONTAINER_NAME: ${{ vars.CONTAINER_NAME || 'aidedesk' }}

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  # Secrets can't be read in a job-level `if`, so check once and pass it on.
  # Until the AWS keys are added, pushes stay green instead of failing.
  aws-configured:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -n "$KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::AWS_ACCESS_KEY_ID secret is not set yet, so nothing was built or deployed. See DEPLOY.md step 3."
          fi

  build:
    needs: [test, aws-configured]
    if: needs.aws-configured.outputs.ok == 'true'
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.uri }}
    steps:
      - uses: actions/checkout@v7
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - id: image
        run: echo "uri=${{ steps.ecr.outputs.registry }}/$ECR_REPOSITORY" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      # The root Dockerfile builds the React app into the backend's public/
      # folder, so this one image is the whole site. GitHub's runners build
      # x86 images, which is what the Fargate task runs.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.uri }}:${{ github.sha }}
            ${{ steps.image.outputs.uri }}:latest
          # Otherwise buildx adds attestation manifests that ECR lists as
          # extra untagged images.
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # The very first image is pushed before the ECS service exists (DEPLOY.md
      # creates the service from it), so skip until there is one to update.
      - name: Check the ECS service exists
        id: service
        run: |
          if ! active=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
                --query "length(services[?status=='ACTIVE'])" --output text 2>&1); then
            if [[ "$active" == *ClusterNotFoundException* ]]; then
              active=0
            else
              echo "$active"
              exit 1
            fi
          fi
          if [ "$active" = "1" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Service $ECS_SERVICE isn't in cluster $ECS_CLUSTER yet. The image is in ECR, but nothing was deployed. See DEPLOY.md step 8."
          fi

      # The task definition holds the environment variables, secrets included,
      # so it lives in AWS rather than in this public repo. Start from the live
      # one and swap only the image.
      - name: Download the current task definition
        if: steps.service.outputs.exists == 'true'
        run: |
          aws ecs describe-task-definition --task-definition "$ECS_TASK_DEFINITION" \
            --query taskDefinition > task-definition.json

      - id: render
        if: steps.service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: ${{ env.CONTAINER_NAME }}
          image: ${{ needs.build.outputs.image }}:${{ github.sha }}

      # Waits until the new task passes the load balancer's health check. If it
      # never does, ECS's circuit breaker keeps the old task and this job fails.
      - if: steps.service.outputs.exists == 'true'
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render.outputs.task-definition }}
          cluster: ${{ env.ECS_CLUSTER }}
          service: ${{ env.ECS_SERVICE }}
          wait-for-service-stability: true
          wait-for-minutes: 15
