services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    # Public DNS — the host resolver refuses SRV/external lookups in some networks.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Frontend:/app
      - Frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    # Public DNS so the container can resolve MongoDB Atlas (SRV), OpenRouter,
    # Gemini and the npm registry — the default resolver fails here.
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ./Backend:/app
      - Backend_node_modules:/app/node_modules
    env_file:
      - ./Backend/.env

volumes:
  mongodb_data:
  Frontend_node_modules:
  Backend_node_modules:
