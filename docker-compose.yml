services:
  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/src :/app/src
      - Frontend_node_modules:/app/node_modules

  backend:
    build:
      context: ./Backend
      dockerfile: dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./Backend:/app
      - Backend_node_modules:/app/node_modules
    env_file:
      - ./Backend/.env

volumes:
  mongodb_data:
  Frontend_node_modules:
  Backend_node_modules:
