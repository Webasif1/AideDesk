# CI/CD: every push to main is tested, built into a Docker image, pushed to
# GitHub Container Registry and rolled out to the EC2 server (see DEPLOY.md).
# Pull requests only run the tests.
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One run per branch at a time; a newer push waits instead of racing a deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Backend/package-lock.json
      - run: npm ci
      - run: npm test

  build:
    needs: test
    # Only main ships. Pull requests have a refs/pull/... ref, so they stop here.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # Registry paths must be lowercase, and the repo owner is "Webasif1".
      - id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The root Dockerfile builds the React app and puts it in the backend's
      # public/ folder, so this one image is the whole site.
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          # Links the image to this repo so the deploy job's token can pull it.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
    env:
      EC2_HOST: ${{ secrets.EC2_HOST }}
    steps:
      # Until the server exists and its secrets are added, skip instead of
      # failing every push.
      - name: Check the server is configured
        id: check
        run: |
          if [ -z "$EC2_HOST" ]; then
            echo "::notice::EC2_HOST secret is not set yet, so nothing was deployed. See DEPLOY.md step 8."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up SSH
        if: steps.check.outputs.skip != 'true'
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          # tr strips Windows line endings a pasted .pem may carry.
          printf '%s\n' "$EC2_SSH_KEY" | tr -d '\r' > ~/.ssh/id_ec2
          chmod 600 ~/.ssh/id_ec2
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        if: steps.check.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh_ec2() { ssh -i ~/.ssh/id_ec2 "ubuntu@$EC2_HOST" "$@"; }

          # Over stdin, so the token never shows up in a command line on the server.
          printf '%s' "$TOKEN" | ssh_ec2 "docker login ghcr.io -u $ACTOR --password-stdin"

          ssh_ec2 "IMAGE_TAG=$IMAGE_TAG bash -s" <<'EOF'
          set -euo pipefail
          trap 'docker logout ghcr.io >/dev/null' EXIT
          cd ~/AideDesk
          # Picks up changes to docker-compose.prod.yml and deploy/Caddyfile.
          git pull --ff-only
          compose() { docker compose -f docker-compose.prod.yml "$@"; }
          compose pull app
          compose up -d --no-build
          docker image prune -f

          # Wait for the app to answer; on failure print its logs so the
          # reason shows up in the Actions run.
          for _ in $(seq 1 30); do
            if compose exec -T app wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1; then
              echo "Deployed ${IMAGE_TAG} and the app is healthy."
              exit 0
            fi
            sleep 2
          done
          echo "The app did not become healthy. Last logs:"
          compose logs --tail 50 app
          exit 1
          EOF
